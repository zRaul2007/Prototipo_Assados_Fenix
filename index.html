    <!-- Raiz da aplicação: login ou a tela do perfil, desenhados por js/nucleo.js -->
    <div id="app"></div>

    <!-- Camada escura, janela (modal) e mensagem rápida (toast), controladas por js/nucleo.js -->
    <div class="fundo" id="fundo" data-a="x"></div>
    <div class="modal" id="mod" role="dialog" aria-modal="true"></div>
    <div class="toast" id="toast" role="status"></div>

    <!--
      Scripts, na ordem em que dependem uns dos outros:
      dados -> utilitários -> núcleo -> telas -> app (eventos e inicialização)
    -->
    <script src="js/dados.js"></script>
    <script src="js/util.js"></script>
    <script src="js/nucleo.js"></script>
    <script src="js/login.js"></script>
    <script src="js/cliente.js"></script>
    <script src="js/operacao.js"></script>
    <script src="js/dashboard.js"></script>
